server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/school_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: school
    password: school
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt-secret: classday-prototype-secret-key-change-later-32
  jwt-hours: 72
  ingest-key: classday-ingest-dev
  upload-dir: uploads
