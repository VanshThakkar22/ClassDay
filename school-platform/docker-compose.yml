services:
  mysql:
    image: mysql:8.4
    container_name: classday-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_platform
      MYSQL_USER: school
      MYSQL_PASSWORD: school
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - classday-mysql:/var/lib/mysql

volumes:
  classday-mysql:
