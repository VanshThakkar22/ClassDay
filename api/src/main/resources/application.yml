spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/openbell?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:openbell}
    password: ${DB_PASSWORD:openbell}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

app:
  jwt-secret: ${JWT_SECRET:dev-only-change-me-before-any-real-school-data-0123456789}
  file-dir: ${FILE_DIR:./uploads}
